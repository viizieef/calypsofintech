services:
  # Render Web Service (Node.js full-stack container on 100% Free Tier)
  - type: web
    name: calypso-bir
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VITE_SUPABASE_URL
        sync: false # Set in Render Dashboard with your Supabase Project URL
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard with your Supabase Anon API Key
